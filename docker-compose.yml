services:
  go-proxy-server:
    container_name: go-proxy-server
    build: .
    # ndppd 与随机源地址绑定都要求看到宿主机真实网卡，不能走 bridge
    network_mode: host
    environment:
      # 网卡名从 .env 读取（每台机器不同：eth0 / enp2s0 / ens18 …，不能写死）；
      # 留空时代理进程会扫描所有网卡找公网 IPv6。
      - NET_IF=${NET_IF:-}
      - RUN_ENV=prod
      # 日志：默认只打印启动/异常/池前缀变化；排障时打开 DEBUG 才会输出每请求日志
      # - DEBUG=true
      # 拨号：坏出口早放弃早换（池里/随机取，失败就换下一个）
      # - DIAL_TIMEOUT_SECONDS=5    # 单个出口拨号超时
      # - DIAL_MAX_ATTEMPTS=5       # 单次请求最多换几个出口
      # 回程 NS 代答后端：userspace（默认）= 内置代答器覆盖整段 /64，内核 neigh 表零条目；
      # kernel = 内核 proxy_ndp，用哪个地址就 add 一条 pneigh（/64 不可能一条条加，只适合小规模）
      - NDP_BACKEND=${NDP_BACKEND:-ndppd}
      # userspace 后端把网卡置为 allmulticast：整段代答必须能收到任意 solicited-node 组播组的 NS
      - NDP_ALLMULTICAST=${NDP_ALLMULTICAST:-on}
      # 出口地址池：留空 = 按后端取默认（userspace 每请求新地址；kernel 512）
      - EXIT_POOL_SIZE=${EXIT_POOL_SIZE:-0}
      # 池内地址轮换周期（秒）：到期换一批新的 /64 随机地址（0 = 不轮换；仅配了池时生效）
      - EXIT_POOL_RENEW_SECONDS=${EXIT_POOL_RENEW_SECONDS:-600}
      # kernel 后端下内置代答器的开关：auto = proxy_ndp 可用就不启；on / off 可强制
      - NDP_RESPONDER=${NDP_RESPONDER:-auto}
    # 直接挂载宿主机编译好的二进制：改完 Go 代码只需 ./build.sh && docker compose restart，
    # 不必重新构建镜像。镜像里仍内置一份，挂载目录里没有二进制时自动回落到内置版本。
    volumes:
      - ./bin:/opt/bin:ro
    command:
      - /bin/sh
      - -c
      - |
        if [ -x /opt/bin/go-proxy-ipv6-pool ]; then
          exec /opt/bin/go-proxy-ipv6-pool
        fi
        exec /app/go-proxy-ipv6-pool
    # 程序会执行 `ip route replace local <前缀>/64 dev lo`、`ip -6 addr add/del`、
    # 写 /etc/ndppd.conf 并重启 ndppd：
    # NET_ADMIN 用于改宿主机路由表/接口地址，NET_RAW 用于 ndppd 收发 NDP 原始报文
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # docker-default 的 AppArmor 策略会拦原始套接字等操作，放开后 ndppd 才能正常应答
    security_opt:
      - apparmor=unconfined
    restart: unless-stopped
